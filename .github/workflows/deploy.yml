name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch texts
        run: curl -sL "https://drive.google.com/uc?export=download&id=1l29C7yExrICVs-6T0kiyRWjV7-8kVAkB" -o t.zip && unzip -o t.zip -d src/data && mkdir -p public/brand && cp src/data/brand/*.png public/brand/ && rm -rf src/data/brand
      - run: npx astro build
      - run: npx pagefind --site dist --force-language ar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
